# Cấu hình gitleaks — H-0.2 (Gate 0 FORDEX). Quét bí mật trong lịch sử git ở CI.
# Kế thừa toàn bộ rule mặc định của gitleaks; chỉ bổ sung allowlist cho các
# false-positive đã kiểm chứng (giá trị ví dụ trong tài liệu, KHÔNG phải bí mật thật).
title = "VATCrawlbot gitleaks"

[extend]
useDefault = true

# Dùng dạng MẢNG `[[allowlists]]` (không phải `[allowlist]` đơn) vì đã có hơn một
# false-positive độc lập: mỗi mục giữ `condition = "AND"` riêng của nó. Gộp chung vào một
# mục sẽ làm AND bắc cầu sai — path của mục này khớp với regex của mục kia, và blast radius
# rộng ra đúng thứ mà condition=AND sinh ra để thu hẹp.

[[allowlists]]
description = "FP đã kiểm chứng (2026-07-15): giá trị ví dụ trong ADR-0001, không phải bí mật thật."
# condition=AND: finding chỉ được bỏ qua khi ĐỒNG THỜI (a) nằm trong đúng file
# ADR-0001 VÀ (b) khớp mẫu hex ví dụ. Nhờ vậy nếu về sau có chuỗi trùng tiền tố
# `6a549f...` ở BẤT KỲ file nào khác, gitleaks VẪN bắt (thu hẹp blast radius —
# defense-in-depth theo khuyến nghị chuẩn gitleaks).
condition = "AND"
# Ví dụ minh hoạ trong ADR-0001 §probe GDT: các giá trị `key` là ID lưu trữ hex
# 24 ký tự (bắt đầu `6a549f`) đi kèm `"content":"<svg ...>"` — dữ liệu mẫu tài
# liệu, gitleaks nhận nhầm là generic-api-key.
paths = [
  '''docs/adr/0001-nen-tang-cloudflare\.md''',
]
regexes = [
  '''6a549f[0-9a-f]{18}''',
]

[[allowlists]]
description = "FP đã kiểm chứng (2026-07-22): hằng SECRET giả trong test unit Turnstile (U33)."
# Bối cảnh: CI trunk ĐỎ ở commit 8be6fd3 vì rule `generic-api-key` (entropy 3.72) bắt hằng
# `0xTEST_SECRET_KHONG_PHAI_THAT` ở apps/api/test/unit/turnstile.test.ts:14. Chuỗi tự nó
# nói ra nó là gì. Không sửa được bằng cách đổi file hiện tại: gitleaks quét TOÀN LỊCH SỬ,
# nên giá trị vẫn nằm ở commit cũ vĩnh viễn.
#
# Neo theo đúng chuỗi literal chứ KHÔNG theo mẫu chung như `0xTEST[A-Z_]+`: mẫu rộng sẽ
# lặng lẽ tha cho mọi hằng đặt tên giống vậy trong tương lai, kể cả khi ai đó dán nhầm secret
# thật vào một biến tên `0xTEST_...`. Thêm secret giả mới ⇒ thêm dòng mới ở đây, có chủ đích.
condition = "AND"
paths = [
  '''apps/api/test/unit/turnstile\.test\.ts''',
]
regexes = [
  '''0xTEST_SECRET_KHONG_PHAI_THAT''',
]

[[allowlists]]
description = "FP đã kiểm chứng (2026-07-22): Turnstile SITE key — công khai theo thiết kế, không phải bí mật."
# Bối cảnh: site key Turnstile được Cloudflare NHÚNG VÀO HTML CLIENT cho mọi khách xem
# được — đó là cách widget hoạt động. Bí mật thật là TURNSTILE_SECRET_KEY, nằm ở Workers
# Secret của vat-api và KHÔNG bao giờ vào repo. Giá trị dưới đây vốn đã public trong bundle
# production (`/assets/index-*.js`) trước khi vào file này.
#
# Vì sao PHẢI commit dù entropy cao: biến này nhúng LÚC BUILD. Không có nó trong
# .env.production thì `npm run build -w apps/web` ra bundle khoá nút Đăng nhập trong khi
# `wrangler deploy` vẫn báo thành công — sự cố mất đăng nhập toàn hệ thống 2026-07-22
# (xem docs/plans/production-deploy.md). Để nó ngoài repo là đánh đổi một cảnh báo giả lấy
# một cái bẫy sập thật.
#
# Neo theo đúng chuỗi literal, KHÔNG dùng mẫu rộng kiểu `0x4[A-Za-z0-9_-]+` — mẫu rộng sẽ
# lặng lẽ tha cho mọi khoá tương lai có cùng hình dạng, kể cả secret thật. Đổi site key ⇒
# sửa dòng regex này, có chủ đích (cùng nguyên tắc mục 0xTEST_SECRET bên trên).
condition = "AND"
paths = [
  '''apps/web/\.env\.production''',
]
regexes = [
  '''0x4AAAAAAD6d5RwMpZVh-PZq''',
]

[[allowlists]]
description = "FP đã kiểm chứng (2026-07-29): token GIẢ trong test integration đường tải công khai (U37c)."
# Bối cảnh: CI trunk ĐỎ ở commit 5a65a8a vì rule `generic-api-key` (entropy 4.70) bắt hằng
# `const TOKEN = "abcdefghijkmnpqrstuvwxyz23"` ở apps/api/test/integration/taiCongKhai.test.ts:12.
# Entropy cao chỉ vì 26 ký tự đều KHÁC NHAU — đó chính xác là 26 ký tự ĐẦU của bảng chữ công
# khai `CHU_CAI` trong apps/api/src/routes/goiChiaSe.ts:43, tức giá trị suy ra được từ mã nguồn,
# ngược hẳn với "ngẫu nhiên 130 bit" mà token thật phải có. Không phải bí mật.
# Không sửa được bằng cách đổi file hiện tại: gitleaks quét TOÀN LỊCH SỬ, nên giá trị vẫn nằm
# ở commit cũ vĩnh viễn (cùng bài học mục 0xTEST_SECRET_KHONG_PHAI_THAT bên trên).
#
# Neo theo đúng chuỗi literal + đúng file, KHÔNG dùng mẫu rộng kiểu `[a-z2-9]{26}` — mẫu rộng
# sẽ lặng lẽ tha cho MỌI token chia sẻ thật 26 ký tự sinh từ chính bảng chữ này nếu có ngày ai
# đó dán nhầm một token production vào repo. Đúng thứ hàng rào ấy đang bảo vệ file công khai.
condition = "AND"
paths = [
  '''apps/api/test/integration/taiCongKhai\.test\.ts''',
]
regexes = [
  '''abcdefghijkmnpqrstuvwxyz23''',
]

# CHỦ Ý không allowlist các file *.example / .dev.vars.example: chúng chỉ chứa
# placeholder (baseline scan 2026-07-15 sạch), và vẫn muốn gitleaks quét để bắt
# trường hợp lỡ tay đưa bí mật thật vào file mẫu.
