[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["frontend/"]

[tool.pytest.ini_options]
markers = [
    "unit: test đơn vị, chạy offline, mock mọi gọi mạng ra ngoài (mặc định).",
    "integration: cần DB/Redis thật, chạy trong CI/dev có docker-compose.",
    "contract: gọi mạng thật tới endpoint công khai của GDT để phát hiện đổi API. Không chạy trong `make test` mặc định.",
]
testpaths = ["backend/tests"]
addopts = "-m \"not contract\""
