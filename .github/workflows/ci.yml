name: CI

on:
  push:
    # TRUNK THẬT của dự án là `feat/cloudflare-stack-u0` (HEAD mặc định của repo), KHÔNG
    # phải `main` — `main` dừng ở 2026-07-15 và chậm 159 commit (đo 2026-07-20).
    # Trước khi sửa, danh sách này chỉ có `main` ⇒ mọi cú push vào trunk KHÔNG được CI
    # kiểm, kể cả các lần merge PR trước đó. Chỉ PR mới chạy CI. Đây là lỗ hổng quy trình,
    # không phải chủ ý: Definition of Done đòi lint+test xanh, mà cổng máy lại không chạy.
    # 2026-07-21: nhánh `main` đã bị XOÁ khỏi remote khi dọn kho, nên để tên nó ở đây chỉ
    # gây hiểu nhầm là còn có nhánh thứ hai được CI canh. Đổi tên trunk thành `main` là
    # bước C, làm ở phiên riêng — khi đó sửa đúng một dòng này.
    branches: [feat/cloudflare-stack-u0]
  pull_request:
  schedule:
    # GIÁM SÁT mục C — Vòng 1: contract test hằng ngày 02:00 UTC (bắt GDT đổi API +
    # kiểm egress). Thất bại → GitHub tự thông báo (kênh cảnh báo Vòng 1).
    - cron: "0 2 * * *"
  # Cho phép chạy contract test thủ công (kiểm chứng theo yêu cầu, không đợi lịch).
  workflow_dispatch:

jobs:
  # H-0.2: quét bí mật toàn bộ lịch sử git bằng gitleaks (chuẩn), thay cho việc
  # chỉ dựa hook heuristic block-dangerous.sh (vốn chỉ chặn hành động của Claude,
  # KHÔNG quét commit). Chặn PR/push nếu phát hiện bí mật. Binary ghim phiên bản
  # (không dùng gitleaks-action để tránh yêu cầu GITLEAKS_LICENSE cho tổ chức).
  secret-scan:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks cần TOÀN BỘ lịch sử để quét mọi commit
      - name: Cài gitleaks (binary ghim v8.28.0 + xác minh checksum)
        run: |
          VER=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c - # chống giả mạo binary (chuỗi cung ứng)
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Quét bí mật (gitleaks detect toàn lịch sử)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner -v

  quality:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (Biome)
        run: npx biome check .
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present
      # H-0.1: `make test` ép ngưỡng coverage ≥80% cho packages/** (mỗi package
      # chạy `vitest run --coverage`; coverage < 80% → thoát khác 0 → job đỏ →
      # chặn PR). Apps đo coverage ở job nightly `coverage-apps` bên dưới.
      - name: Test packages (coverage-gated) + apps
        run: make test

  # Contract test gọi GDT thật + probe egress — chỉ chạy theo lịch, không chặn PR
  # (tránh phụ thuộc mạng ngoài trong CI PR). Xem .claude/rules/gdt-adapter.md.
  contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:contract --workspaces --if-present

  # H-0.1: coverage apps chạy NIGHTLY (không chặn PR để giữ PR nhanh — test api
  # ~150s). Ngưỡng ≥80% khai báo trong từng apps/*/vitest.config.ts; job này đo
  # và fail nếu tụt dưới ngưỡng.
  coverage-apps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: make test-coverage-apps
